name: Sync Antigravity UA and Protocol

on:
  schedule:
    # Staggered ~8h off-peak UTC slots (12:23, 20:17, 04:41 UTC+8) so GitHub cron drops/delays do not skip a whole day
    - cron: '23 4 * * *'
    - cron: '17 12 * * *'
    - cron: '41 20 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: Force update manifests even if version or protocol is unchanged
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: sync-antigravity
  cancel-in-progress: false

jobs:
  sync-antigravity:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - id: sync-ua
        name: Extract latest paired Antigravity Hub version and CL
        continue-on-error: true
        env:
          FORCE_SYNC: ${{ inputs.force == true && '1' || '0' }}
          LS_BIN_PATH: ${{ runner.temp }}/language_server
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import path from 'node:path';
          import { compareHubVersions, syncHubVersionFromOfficial } from './lib/antigravity-ua.mjs';

          const manifestPath = path.resolve('lib/antigravity-ua.json');
          const current = JSON.parse(fs.readFileSync(manifestPath, 'utf8'));
          const force = process.env.FORCE_SYNC === '1';

          const extracted = await syncHubVersionFromOfficial({
            persist: false,
            syncIdeOAuthUa: true,
            extractBinaryPath: process.env.LS_BIN_PATH,
            timeoutMs: 120000
          });

          const cmp = compareHubVersions(extracted.version, current.version);
          if (!force && cmp < 0) {
            console.log(`Skip downgrade: extracted ${extracted.version} < current ${current.version}`);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, 'changed=false\n');
            process.exit(0);
          }

          const resolvedOAuth = extracted.oauthUserAgent || current.oauthUserAgent || undefined;
          const samePair =
            extracted.version === current.version &&
            extracted.cl === current.cl &&
            resolvedOAuth === (current.oauthUserAgent || undefined);

          if (!force && samePair) {
            console.log(`No change: already at ${current.version} (cl=${current.cl}, oauth=${resolvedOAuth || 'default'})`);
            fs.appendFileSync(
              process.env.GITHUB_OUTPUT,
              `changed=false\nversion=${extracted.version}\ncl=${extracted.cl}\n`
            );
            process.exit(0);
          }

          const next = {
            version: extracted.version,
            cl: extracted.cl,
            ...(resolvedOAuth ? { oauthUserAgent: resolvedOAuth } : {}),
            source: 'official-sync',
            updatedAt: extracted.detectedAt
          };
          fs.writeFileSync(manifestPath, JSON.stringify(next, null, 2) + '\n', 'utf8');
          fs.appendFileSync(
            process.env.GITHUB_OUTPUT,
            `changed=true\nversion=${next.version}\ncl=${next.cl}\n`
          );
          console.log(`Updated lib/antigravity-ua.json -> ${next.version} (cl=${next.cl}, oauth=${resolvedOAuth || 'default'})`);
          JS
      - id: sync-protocol
        name: Probe official language_server wire protocol (zero-credential)
        if: steps.sync-ua.outcome == 'success'
        continue-on-error: true
        env:
          FORCE_SYNC: ${{ inputs.force == true && '1' || '0' }}
          LS_BIN_PATH: ${{ runner.temp }}/language_server
        run: |
          BIN_ARGS=()
          if [ -f "$LS_BIN_PATH" ]; then
            BIN_ARGS+=(--binary "$LS_BIN_PATH")
          fi
          if [ "$FORCE_SYNC" = "1" ]; then
            node scripts/sync-antigravity-protocol.mjs "${BIN_ARGS[@]}" --write --force
          else
            node scripts/sync-antigravity-protocol.mjs "${BIN_ARGS[@]}" --write
          fi
      - id: verify-before-push
        name: Verify guardrails and Antigravity tests before push
        if: steps.sync-ua.outcome == 'success' && steps.sync-protocol.outcome == 'success' && (steps.sync-ua.outputs.changed == 'true' || steps.sync-protocol.outputs.changed == 'true')
        continue-on-error: true
        run: |
          npm run check
          node --test test/antigravity-ua.test.mjs test/antigravity.test.mjs test/guardrails.test.mjs
      - name: Notify via GitHub issue when protocol drift breaks verification
        if: steps.sync-ua.outcome == 'failure' || steps.sync-protocol.outcome == 'failure' || steps.verify-before-push.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.sync-protocol.outputs.version || steps.sync-ua.outputs.version }}
          CL: ${{ steps.sync-protocol.outputs.cl || steps.sync-ua.outputs.cl }}
          DRIFT_FAILED: ${{ steps.verify-before-push.outcome == 'failure' && '1' || '0' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$DRIFT_FAILED" = "1" ]; then
            TITLE="[Antigravity Sync] Protocol drift detected (${VERSION:-unknown}, cl=${CL:-unknown})"
            BODY="Daily zero-credential protocol sync detected breaking upstream changes that could not be auto-adapted by mapper/protocol parity tests.\n\n- Version: \`${VERSION:-unknown}\`\n- CL: \`${CL:-unknown}\`\n- Workflow run: ${RUN_URL}\n- Auto-push skipped safely to avoid UA/payload mismatch."
            echo "::warning::${TITLE} — auto-push skipped and issue reported (${RUN_URL})"
          else
            TITLE="[Antigravity Sync] Upstream sync warning (${VERSION:-unknown}, cl=${CL:-unknown})"
            BODY="Daily zero-credential UA/protocol sync encountered an upstream fetch or probe error.\n\n- Version: \`${VERSION:-unknown}\`\n- CL: \`${CL:-unknown}\`\n- Workflow run: ${RUN_URL}"
            echo "::warning::${TITLE} (${RUN_URL})"
          fi
          EXISTING=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"[Antigravity Sync]\"" --json number --jq '.[0].number // empty' || true)
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --repo "$GITHUB_REPOSITORY" --body "$(printf '%b' "$BODY")" || true
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "$(printf '%b' "$BODY")" || true
          fi
      - name: Clean up extracted language_server binary
        if: always()
        run: rm -f "${{ runner.temp }}/language_server"
      - name: Commit and push updated Antigravity manifests
        if: steps.sync-ua.outcome == 'success' && steps.sync-protocol.outcome == 'success' && steps.verify-before-push.outcome == 'success' && (steps.sync-ua.outputs.changed == 'true' || steps.sync-protocol.outputs.changed == 'true')
        env:
          VERSION: ${{ steps.sync-protocol.outputs.version || steps.sync-ua.outputs.version }}
          CL: ${{ steps.sync-protocol.outputs.cl || steps.sync-ua.outputs.cl }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/antigravity-ua.json lib/antigravity-protocol.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(antigravity): sync UA & protocol (${VERSION:-latest}, cl=${CL:-unknown})"
            git push origin HEAD:main
          else
            echo "No manifest changes to commit."
          fi
